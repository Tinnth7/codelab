[package]
name = "codelab"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["glow", "default_fonts", "persistence", "wayland", "x11"] }
egui = "0.28"
directories = "5.0"
chrono = "0.4"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tree-sitter = "0.21"
tree-sitter-python = "0.21"
tree-sitter-cpp = "0.22"
tree-sitter-c = "0.21"
tree-sitter-javascript = "0.21"
tree-sitter-typescript = "0.21"
tree-sitter-rust = "0.21"

syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }

# File dialogs: XDG portal on Linux (works on niri/Wayland), native Win32/macOS dialogs elsewhere.
# Keep rfd's default features on Windows: it needs "common-controls-v6" for message dialogs.
[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = "0.15"

# Embeds assets/icon.ico into Codelab.exe (see build.rs)
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
strip = true
