[package]
name = "codelab"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["glow", "default_fonts", "persistence"] }
egui = "0.28"
rfd = "0.14"
directories = "5.0"
chrono = "0.4"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tree-sitter = "0.21"
tree-sitter-python = "0.21"
tree-sitter-cpp = "0.22"
tree-sitter-c = "0.21"
tree-sitter-javascript = "0.21"
tree-sitter-typescript = "0.21"
tree-sitter-rust = "0.21"

syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
